<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Vantage</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
/* ── Variables ──────────────────────────────────────────────────────────── */
:root {
  --bg: #080a0d;
  --surface: #0f1318;
  --surface2: #161b22;
  --border: #272d36;
  --border-subtle: #1b212a;
  --text: #e6edf3;
  --muted: #7d8590;
  --muted2: #8b949e;
  --accent: #58a6ff;
  --accent-dim: rgba(88,166,255,0.12);
  --green: #3fb950;
  --green-dim: rgba(63,185,80,0.15);
  --red: #f85149;
  --red-dim: rgba(248,81,73,0.15);
  --yellow: #d29922;
  --purple: #bc8cff;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

/* ── Reset ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5; overflow:hidden; }
button { font-family:inherit; cursor:pointer; }
input { font-family:inherit; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ── App grid ───────────────────────────────────────────────────────────── */
.app {
  display:grid;
  grid-template-columns:272px 1fr;
  grid-template-rows:52px 34px 1fr;
  height:100vh;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
header {
  grid-column:1/-1;
  background:var(--surface);
  border-bottom:1px solid var(--border-subtle);
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:14px;
  z-index:60;
}
.menu-btn {
  display:none; background:none; border:1px solid var(--border-subtle);
  color:var(--muted2); border-radius:8px; width:32px; height:32px;
  align-items:center; justify-content:center; flex-shrink:0; transition:all .15s;
}
.menu-btn:hover { color:var(--text); border-color:var(--accent); }
.logo {
  font-size:16px; font-weight:800; white-space:nowrap; letter-spacing:-.4px;
  background:linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  display:flex; align-items:center; gap:7px;
  text-decoration:none;
}
.search-wrap { position:relative; flex:1; max-width:440px; }
.search-wrap input {
  width:100%;
  background:var(--bg);
  border:1px solid var(--border-subtle);
  color:var(--text);
  padding:7px 12px 7px 34px;
  border-radius:8px;
  font-size:13px;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-wrap input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none; }
.search-results {
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  z-index:100; display:none; box-shadow:0 8px 24px rgba(0,0,0,.5); overflow:hidden;
}
.search-results.open { display:block; }
.search-item { padding:9px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.search-item:hover { background:var(--bg); }
.search-item .si-left { display:flex; flex-direction:column; gap:2px; }
.search-item .sym { font-weight:700; font-size:13px; color:var(--accent); font-family:var(--mono); }
.search-item .nm { color:var(--muted2); font-size:11px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-item .ex { color:var(--muted); font-size:11px; white-space:nowrap; font-family:var(--mono); }
.header-time { color:var(--muted); font-size:11px; margin-left:auto; white-space:nowrap; font-family:var(--mono); }
.market-status {
  font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0;
}
.market-status.open  { background:var(--green-dim); color:var(--green); }
.market-status.closed { background:rgba(125,133,144,.15); color:var(--muted); }

/* ── Market Bar ─────────────────────────────────────────────────────────── */
.market-bar {
  grid-column:1/-1;
  background:#05070a;
  border-bottom:1px solid var(--border-subtle);
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:0;
  overflow-x:auto;
  scrollbar-width:none;
}
.market-bar::-webkit-scrollbar { display:none; }
.mi {
  display:flex; align-items:center; gap:7px;
  padding:0 16px 0 0; margin-right:16px;
  border-right:1px solid var(--border-subtle);
  white-space:nowrap;
}
.mi:last-child { border-right:none; }
.mi-label { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
.mi-price { font-size:12px; font-weight:600; font-family:var(--mono); letter-spacing:-0.01em; }
.mi-chg { font-size:11px; font-family:var(--mono); }
.mi-loading { color:var(--muted); font-size:11px; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
aside {
  background:var(--surface);
  border-right:1px solid var(--border-subtle);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.sidebar-tabs {
  display:flex;
  border-bottom:1px solid var(--border-subtle);
  flex-shrink:0;
}
.sidebar-tab {
  flex:1; background:none; border:none; color:var(--muted2);
  padding:10px 0; font-size:12px; font-weight:600; letter-spacing:.02em;
  border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
}
.sidebar-tab:hover { color:var(--text); }
.sidebar-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.sidebar-body { flex:1; overflow-y:auto; padding:12px 10px; }
.sidebar-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
  z-index:40; opacity:0; transition:opacity .2s;
}
.sidebar-overlay.show { display:block; opacity:1; }

/* ── Watchlist ───────────────────────────────────────────────────────────── */
.watch-item {
  display:flex; align-items:center;
  padding:8px; border-radius:8px; cursor:pointer; gap:9px;
  transition:background .1s;
  position:relative;
}
.watch-item:hover { background:var(--bg); }
.watch-item.active { background:var(--bg); border-left:3px solid var(--accent); padding-left:5px; }
.watch-main { min-width:0; flex:1; }
.watch-sym { font-weight:700; font-size:13px; font-family:var(--mono); }
.watch-name { font-size:10px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.watch-spark { flex-shrink:0; width:64px; height:22px; }
.watch-right { text-align:right; flex-shrink:0; }
.watch-price-val { font-size:13px; font-weight:600; font-family:var(--mono); border-radius:4px; padding:0 2px; }
.watch-chg { font-size:10px; margin-top:1px; font-family:var(--mono); }
.watch-remove {
  background:none; border:none; color:var(--muted); font-size:16px; line-height:1;
  padding:0 2px; display:none; position:absolute; right:4px; top:50%; transform:translateY(-50%);
  transition:color .1s; background:var(--bg);
}
.watch-remove:hover { color:var(--red); }
.watch-item:hover .watch-remove { display:block; }
.watch-empty { color:var(--muted); font-size:12px; text-align:center; padding:24px 12px; line-height:1.7; }

/* ── Browse tab ─────────────────────────────────────────────────────────── */
.category-pills { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.cat-pill {
  background:none; border:1px solid var(--border); color:var(--muted2);
  padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600;
  transition:all .15s;
}
.cat-pill:hover { border-color:var(--accent); color:var(--accent); }
.cat-pill.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
.browse-search { margin-bottom:10px; }
.browse-search input {
  width:100%; background:var(--bg); border:1px solid var(--border-subtle); color:var(--text);
  padding:6px 10px; border-radius:7px; font-size:12px; outline:none;
}
.browse-search input:focus { border-color:var(--accent); }
.browse-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:7px 8px; border-radius:7px; cursor:pointer; transition:background .1s;
}
.browse-item:hover { background:var(--bg); }
.browse-ticker { font-size:12px; font-weight:700; color:var(--text); font-family:var(--mono); }
.browse-name { font-size:10px; color:var(--muted); margin-top:1px; }
.browse-add { font-size:16px; color:var(--muted); transition:color .1s; }
.browse-item:hover .browse-add { color:var(--accent); }

/* ── Main area ───────────────────────────────────────────────────────────── */
main {
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
  background:var(--bg);
}

/* ── Empty / Error states ────────────────────────────────────────────────── */
.state-box {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:60px 20px; text-align:center; gap:10px; color:var(--muted);
}
.state-icon { font-size:40px; margin-bottom:4px; }
.state-title { font-size:16px; font-weight:600; color:var(--text); }
.state-sub { font-size:13px; max-width:320px; line-height:1.6; }
.retry-btn {
  margin-top:6px; background:var(--accent); border:none; color:#fff;
  padding:8px 18px; border-radius:8px; font-size:13px; font-weight:600;
  transition:opacity .15s;
}
.retry-btn:hover { opacity:.85; }

/* ── Skeleton loaders ───────────────────────────────────────────────────── */
@keyframes sk-shimmer {
  0%   { background-position:-600px 0 }
  100% { background-position:600px 0 }
}
.sk {
  background:linear-gradient(90deg,var(--border-subtle) 25%,rgba(48,54,61,0.9) 50%,var(--border-subtle) 75%);
  background-size:1200px 100%;
  border-radius:5px;
  animation:sk-shimmer 1.5s linear infinite;
}

/* ── Price flash ────────────────────────────────────────────────────────── */
@keyframes flash-up   { 0% { background:var(--green-dim) } 100% { background:transparent } }
@keyframes flash-down { 0% { background:var(--red-dim) }   100% { background:transparent } }
.flash-up   { animation:flash-up .7s ease; }
.flash-down { animation:flash-down .7s ease; }

/* ── Quote card ─────────────────────────────────────────────────────────── */
.quote-card {
  background:rgba(15,19,24,0.9);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border-subtle);
  border-top-color:rgba(255,255,255,0.07);
  border-radius:12px;
  padding:18px 22px;
}
.quote-top {
  display:flex; justify-content:space-between; align-items:flex-start;
  flex-wrap:wrap; gap:12px; margin-bottom:16px;
}
.quote-meta { display:flex; flex-direction:column; gap:3px; }
.quote-id { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; font-family:var(--mono); }
.quote-name { font-size:18px; font-weight:700; line-height:1.3; }
.quote-sector { font-size:11px; color:var(--muted); }
.quote-price-block { text-align:right; }
.quote-price { font-size:28px; font-weight:800; line-height:1.1; font-family:var(--mono); letter-spacing:-0.02em; border-radius:6px; padding:0 4px; display:inline-block; }
.quote-change { font-size:14px; margin-top:4px; font-family:var(--mono); }
.quote-ts { font-size:10px; color:var(--muted); margin-top:5px; font-family:var(--mono); }
.quote-ts .refresh-btn {
  background:none; border:1px solid var(--border); border-radius:20px;
  color:var(--muted); font-size:10px; padding:1px 7px; margin-left:4px;
  transition:all .15s;
}
.quote-ts .refresh-btn:hover { color:var(--accent); border-color:var(--accent); }

/* ── 52-week range bar ──────────────────────────────────────────────────── */
.range-block { margin-top:6px; }
.range-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.range-title { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.range-pos { font-size:10px; color:var(--muted2); font-family:var(--mono); }
.range-track {
  position:relative; height:6px; border-radius:6px;
  background:linear-gradient(90deg, var(--red-dim) 0%, var(--surface2) 50%, var(--green-dim) 100%);
  border:1px solid var(--border-subtle);
}
.range-dot {
  position:absolute; top:50%; width:11px; height:11px;
  background:var(--text); border-radius:50%; transform:translate(-50%,-50%);
  box-shadow:0 0 6px rgba(0,0,0,.8); transition:left .4s ease;
}
.range-labels { display:flex; justify-content:space-between; margin-top:6px; font-size:10px; font-family:var(--mono); }
.range-labels .lo { color:var(--red); }
.range-labels .hi { color:var(--green); }
.range-labels .cap { color:var(--muted); }

/* ── Analyst block ──────────────────────────────────────────────────────── */
.analyst-block {
  margin-top:14px; background:var(--bg); border:1px solid var(--border-subtle);
  border-radius:10px; padding:12px 14px;
}
.analyst-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.analyst-title { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.analyst-rec { display:flex; align-items:center; gap:8px; }
.rec-count { font-size:11px; color:var(--muted); font-family:var(--mono); }
.analyst-target { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
.analyst-target .at-label { font-size:11px; color:var(--muted); }
.analyst-target .at-val { font-size:15px; font-weight:700; font-family:var(--mono); }
.analyst-target .at-up { font-size:12px; font-weight:700; font-family:var(--mono); }
.analyst-bar {
  position:relative; height:5px; border-radius:5px; background:var(--surface2);
  border:1px solid var(--border-subtle);
}
.analyst-bar .ab-fill { position:absolute; top:0; bottom:0; border-radius:5px; }
.analyst-bar .ab-mark {
  position:absolute; top:50%; width:9px; height:9px; border-radius:50%;
  transform:translate(-50%,-50%); border:2px solid var(--bg);
}
.analyst-bar-labels { display:flex; justify-content:space-between; margin-top:5px; font-size:9px; color:var(--muted); font-family:var(--mono); }

/* ── Momentum Score ──────────────────────────────────────────────────────── */
.momentum-block { background:var(--surface); border:1px solid var(--border-subtle); border-top-color:rgba(255,255,255,0.05); border-radius:10px; padding:12px 16px; }
.momentum-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.momentum-title { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
.momentum-label-text { font-size:12px; font-weight:700; }
.momentum-track {
  position:relative; height:6px;
  background:linear-gradient(90deg, var(--red) 0%, var(--border-subtle) 50%, var(--green) 100%);
  border-radius:6px; margin-bottom:8px;
}
.momentum-pointer {
  position:absolute; top:50%; width:12px; height:12px;
  background:var(--text); border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 6px rgba(0,0,0,.7);
  transition:left 0.4s ease;
}
.momentum-signals { font-size:10px; color:var(--muted); font-family:var(--mono); }

/* ── Stat groups ────────────────────────────────────────────────────────── */
.stat-group + .stat-group { margin-top:16px; }
.stat-group-title {
  font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.08em;
  text-transform:uppercase; margin-bottom:9px; display:flex; align-items:center; gap:10px;
}
.stat-group-title::after { content:''; flex:1; height:1px; background:var(--border-subtle); }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
.stat { background:var(--bg); border:1px solid var(--border-subtle); border-radius:8px; padding:10px 12px; }
.stat-label { font-size:10px; color:var(--muted); margin-bottom:4px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
.stat-value { font-size:13px; font-weight:700; font-family:var(--mono); }

/* ── Period bar ─────────────────────────────────────────────────────────── */
.period-bar { display:flex; gap:4px; }
.period-btn {
  background:none; border:1px solid var(--border); color:var(--muted);
  padding:4px 11px; border-radius:6px; font-size:11px; font-weight:700;
  font-family:var(--mono); transition:all .15s;
}
.period-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.period-btn:hover:not(.active) { border-color:var(--accent); color:var(--accent); }

/* ── Chart panels ───────────────────────────────────────────────────────── */
.chart-panel {
  background:rgba(15,19,24,0.9); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border-subtle); border-top-color:rgba(255,255,255,0.07);
  border-radius:12px; padding:14px 18px; transition:box-shadow .15s, transform .15s;
}
.chart-panel:hover { box-shadow:0 6px 20px rgba(0,0,0,.35); transform:translateY(-1px); }
.panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
.panel-title { font-size:13px; font-weight:600; }
.chart-wrap canvas { max-height:260px; }
.chart-wrap.sm canvas { max-height:150px; }
.indicators-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* ── Color utilities ────────────────────────────────────────────────────── */
.pos { color:var(--green); text-shadow:0 0 18px rgba(63,185,80,0.38); transition:text-shadow 0.3s ease; }
.neg { color:var(--red); text-shadow:0 0 18px rgba(248,81,73,0.38); transition:text-shadow 0.3s ease; }
.neu { color:var(--muted2); }
.pill { display:inline-block; padding:2px 7px; border-radius:20px; font-size:10px; font-weight:700; }
.pill.green { background:var(--green-dim); color:var(--green); }
.pill.red { background:var(--red-dim); color:var(--red); }
.pill.yellow { background:rgba(210,153,34,.15); color:var(--yellow); }

/* ── Sidebar skeleton ───────────────────────────────────────────────────── */
.watch-skel { display:flex; justify-content:space-between; padding:8px; gap:8px; }

/* ── Responsive ─────────────────────────────────────────────────────────── */
@media(max-width:1024px) {
  .app { grid-template-columns:1fr; }
  .menu-btn { display:flex; }
  aside {
    position:fixed; top:86px; left:0; bottom:0; width:272px; z-index:50;
    transform:translateX(-100%); transition:transform .25s ease;
    box-shadow:8px 0 28px rgba(0,0,0,.55);
  }
  aside.open { transform:translateX(0); }
}
@media(max-width:960px) {
  .indicators-grid { grid-template-columns:1fr; }
}
@media(max-width:640px) {
  header { padding:0 12px; gap:10px; }
  .header-time { display:none; }
  main { padding:12px; gap:12px; }
  .quote-card { padding:14px 16px; }
  .quote-top { flex-direction:column; }
  .quote-price-block { text-align:left; }
  .quote-price { font-size:24px; }
  .stats-grid { grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  .chart-panel { padding:12px 14px; }
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()" aria-label="Menu">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="logo">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0">
    <path d="M2 12L6 7L9 10L14 4" stroke="url(#lg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="lg" x1="2" y1="12" x2="14" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/>
    </linearGradient></defs>
  </svg>
  Vantage
</span>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="Buscar ativo: AAPL, PETR4.SA, BTC-USD…" autocomplete="off"/>
      <div class="search-results" id="searchResults"></div>
    </div>
    <span class="header-time num" id="headerTime"></span>
    <span id="marketStatus" class="market-status"></span>
  </header>

  <!-- Market Bar -->
  <div class="market-bar" id="marketBar">
    <span class="mi-loading">⚡ carregando mercado…</span>
  </div>

  <!-- Sidebar overlay (mobile) -->

const fmt = {
  price(v, digits=2) { return v == null ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:digits, maximumFractionDigits:digits}); },
  pct(v) { return v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(2) + '%'; },
  large(v) {
    if (v == null) return '—';
    if (v >= 1e12) return (v/1e12).toFixed(2)+'T';
    if (v >= 1e9)  return (v/1e9).toFixed(2)+'B';
    if (v >= 1e6)  return (v/1e6).toFixed(2)+'M';
    return Number(v).toLocaleString('pt-BR');
  },
};
const cc = v => v == null ? 'neu' : v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';
const idOf = t => t.replace(/[^a-z0-9]/gi,'_');

// Flash a cell green/down based on price movement
function flashCell(el, oldPrice, newPrice) {
  if (!el || oldPrice == null || newPrice == null || oldPrice === newPrice) return;
  const cls = newPrice > oldPrice ? 'flash-up' : 'flash-down';
  el.classList.remove('flash-up','flash-down');
  void el.offsetWidth;            // restart animation
  el.classList.add(cls);
}

async function api(path) {

}

async function loadSparklines() {

    data.sparklines.forEach(s => {

      if (cv) drawSparkline(cv, s.closes, s.change_pct);
    });
  } catch {}
}

function drawSparkline(canvas, closes, changePct) {
  if (!closes || closes.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const w = 64, h = 22, pad = 2;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const min = Math.min(...closes), max = Math.max(...closes), range = (max - min) || 1;
  const x = i => pad + i / (closes.length - 1) * (w - 2 * pad);
  const y = c => pad + (1 - (c - min) / range) * (h - 2 * pad);
  const up = (changePct ?? 0) >= 0;
  const stroke = up ? '#3fb950' : '#f85149';

  ctx.beginPath();
  closes.forEach((c, i) => i ? ctx.lineTo(x(i), y(c)) : ctx.moveTo(x(i), y(c)));
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.stroke();

  ctx.lineTo(x(closes.length - 1), h); ctx.lineTo(x(0), h); ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, up ? 'rgba(63,185,80,.28)' : 'rgba(248,81,73,.28)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad; ctx.fill();
}

function addToWatchlist(ticker, andLoad = false) {
  ticker = ticker.toUpperCase();
  if (!state.watchlist.includes(ticker)) {
    state.watchlist.push(ticker);
    saveWatchlist();

  renderWatchlist();
  if (andLoad) loadTicker(ticker);
}

function removeFromWatchlist(ticker) {
  state.watchlist = state.watchlist.filter(t => t !== ticker);

  if (state.activeTicker === ticker) {
    clearInterval(state.refreshTimer);
    state.activeTicker = null;
    document.getElementById('main').innerHTML = `

        <div class="state-icon">👈</div>
        <div class="state-title">Ativo removido</div>
        <div class="state-sub">Selecione outro ativo na watchlist.</div>
      </div>`;
  }
  renderWatchlist();
}

async function loadTicker(ticker) {
  state.activeTicker = ticker;
  clearInterval(state.refreshTimer);
  if (isMobile()) toggleSidebar(false);

  document.querySelectorAll('.watch-item').forEach(el => el.classList.remove('active'));
  const id = idOf(ticker);
  const wi = document.getElementById('wi-' + id);
  if (wi) wi.classList.add('active');

  showLoadingSkeleton();

  try {
    const [quote, history, indicators] = await Promise.all([
      api('/quote/' + ticker),
      api('/history/' + ticker + '?period=' + state.activePeriod),
      api('/indicators/' + ticker + '?period=6mo'),
    ]);
    renderDashboard(quote, history, indicators);

    // Auto-refresh quote every 60s
    state.refreshTimer = setInterval(async () => {
      if (state.activeTicker !== ticker) return;
      try {
        const q = await api('/quote/' + ticker);
        patchQuoteCard(q);
        const pEl = document.getElementById('wp-' + id);
        const cEl = document.getElementById('wc-' + id);
        if (pEl) { flashCell(pEl, state.prices[ticker], q.price); pEl.textContent = fmt.price(q.price); }
        if (cEl) { cEl.className = 'watch-chg ' + cc(q.change_pct); cEl.textContent = fmt.pct(q.change_pct); }
        state.prices[ticker] = q.price;
      } catch {}
    }, 60000);
  } catch(e) {
    showError(e.message, ticker);
  }
}

function range52Html(quote) {
  const lo = quote['52w_low'], hi = quote['52w_high'], px = quote.price;
  if (lo == null || hi == null || px == null || hi <= lo) return '';
  const pos = Math.max(0, Math.min(1, (px - lo) / (hi - lo))) * 100;
  return `
    <div class="range-block">
      <div class="range-head">
        <span class="range-title">Range 52 Semanas</span>
        <span class="range-pos">${pos.toFixed(0)}% do range</span>
      </div>
      <div class="range-track">
        <div class="range-dot" style="left:${pos.toFixed(1)}%"></div>
      </div>
      <div class="range-labels">
        <span><span class="cap">mín </span><span class="lo">${fmt.price(lo)}</span></span>
        <span><span class="cap">máx </span><span class="hi">${fmt.price(hi)}</span></span>
      </div>
    </div>`;
}

// ── Analyst block ──────────────────────────────────────────────────────────
function analystHtml(quote) {
  const rec = REC_MAP[quote.analyst_recommendation];
  const target = quote.target_price, px = quote.price;
  const dy = quote.dividend_yield;
  if (!rec && target == null && dy == null) return '';

  let targetRow = '';
  if (target != null && px != null && px > 0) {
    const upside = (target - px) / px * 100;
    const upCls = cc(upside);
    const lo = Math.min(px, target), hi = Math.max(px, target);
    const span = (hi - lo) || 1;
    const pxPos = (px - lo) / span * 100;
    const tgPos = (target - lo) / span * 100;
    const fillLeft = Math.min(pxPos, tgPos), fillW = Math.abs(tgPos - pxPos);
    const fillCol = upside >= 0 ? 'var(--green)' : 'var(--red)';
    targetRow = `
      <div class="analyst-target">
        <span class="at-label">Preço-alvo médio</span>
        <span class="at-val">${fmt.price(target)}</span>
        <span class="at-up ${upCls}">${upside>0?'▲':'▼'} ${fmt.pct(upside)}</span>
      </div>
      <div class="analyst-bar">
        <div class="ab-fill" style="left:${fillLeft}%;width:${fillW}%;background:${fillCol};opacity:.4"></div>
        <div class="ab-mark" style="left:${pxPos}%;background:var(--text)"></div>
        <div class="ab-mark" style="left:${tgPos}%;background:${fillCol}"></div>
      </div>
      <div class="analyst-bar-labels">
        <span>● atual ${fmt.price(px)}</span>
        <span>◆ alvo ${fmt.price(target)}</span>
      </div>`;
  }

  const recHtml = rec
    ? `<div class="analyst-rec">
         <span class="pill ${rec.cls}">● ${rec.label}</span>
         <span class="rec-count">${quote.num_analyst_opinions ? quote.num_analyst_opinions + ' analistas' : ''}</span>
       </div>`
    : '<span></span>';

  const dyHtml = dy != null
    ? `<span class="rec-count">Div. Yield <strong style="color:var(--text)">${(dy*100).toFixed(2)}%</strong></span>`
    : '';

  return `
    <div class="analyst-block">
      <div class="analyst-head">
        <span class="analyst-title">Consenso de Analistas</span>
        ${recHtml}
      </div>
      ${targetRow}
      ${dyHtml ? `<div style="margin-top:${targetRow?'10px':'0'}">${dyHtml}</div>` : ''}
    </div>`;
}

// ── Stat groups ────────────────────────────────────────────────────────────
function statHtml(label, value, cls='') {
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`;
}
function statGroup(title, cells) {
  return `<div class="stat-group">
    <div class="stat-group-title">${title}</div>
    <div class="stats-grid">${cells.join('')}</div>
  </div>`;
}

    statHtml('Abertura', fmt.price(quote.open)),
    statHtml('Máxima',   fmt.price(quote.high), 'pos'),
    statHtml('Mínima',   fmt.price(quote.low),  'neg'),
    statHtml('Volume',   fmt.large(quote.volume)),
    statHtml('Vol Méd 10d', fmt.large(quote.avg_volume_10d)),

    statHtml('Market Cap', fmt.large(quote.market_cap)),

    statHtml('P/VP', quote.pb_ratio ? Number(quote.pb_ratio).toFixed(2) : '—'),

  const risco = statGroup('Risco & Retorno', [
    statHtml('Beta', quote.beta ? Number(quote.beta).toFixed(2) : '—'),

  document.getElementById('main').innerHTML = `
    <!-- Quote Card -->
    <div class="quote-card">
      <div class="quote-top">
        <div class="quote-meta">
          <div class="quote-id">${quote.ticker} · ${quote.exchange} · ${quote.currency}</div>
          <div class="quote-name">${quote.name}</div>
          ${quote.sector ? `<div class="quote-sector">${quote.sector}</div>` : ''}
        </div>
        <div class="quote-price-block">
          <div id="live-price" class="quote-price ${pcc}">${fmt.price(quote.price)}</div>
          <div id="live-change" class="quote-change ${pcc}">
            ${fmt.pct(quote.change_pct)}
            ${quote.change != null ? `(${quote.change > 0 ? '+' : ''}${fmt.price(quote.change)})` : ''}
          </div>
          <div class="quote-ts">
            Atualizado <span id="live-ts">${now}</span>
            <button class="refresh-btn" onclick="forceRefresh()">↻</button>
          </div>
        </div>
      </div>

      ${range52Html(quote)}
      ${analystHtml(quote)}

      <div style="margin-top:16px">
        ${negociacao}
        ${valuation}
        ${risco}
      </div>
    </div>

    <!-- Momentum Score -->
    ${(() => {
      const score = calcMomentumScore(indicators);
      const [label, cls] = momentumLabel(score);
      const pct = 50 + (score / 3) * 50;
      return `<div class="momentum-block">
        <div class="momentum-header">
          <span class="momentum-title">Momentum</span>
          <span class="momentum-label-text ${cls}">${label}</span>
        </div>
        <div class="momentum-track">
          <div class="momentum-pointer" style="left:${pct.toFixed(1)}%"></div>
        </div>
        <div class="momentum-signals">RSI · MACD · Bollinger Bands</div>
      </div>`;
    })()}

    <!-- Price + Volume Chart -->
    <div class="chart-panel">
      <div class="panel-header">
        <span class="panel-title">Preço + Volume</span>
        <div class="period-bar">
          ${[
  {key:'1mo',label:'1M'},{key:'3mo',label:'3M'},
  {key:'6mo',label:'6M'},{key:'1y',label:'1A'},
  {key:'2y',label:'2A'}
].map(({key,label})=>`<button class="period-btn ${key===state.activePeriod?'active':''}" data-period="${key}" onclick="changePeriod('${key}')">${label}</button>`).join('')}
        </div>
      </div>
      <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
    </div>

    <!-- RSI + MACD -->
    <div class="indicators-grid">
      <div class="chart-panel">
        <div class="panel-header"><span class="panel-title">RSI (14)</span></div>
        <div class="chart-wrap sm"><canvas id="rsiChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <div class="panel-header"><span class="panel-title">MACD (12, 26, 9)</span></div>
        <div class="chart-wrap sm"><canvas id="macdChart"></canvas></div>

// ── Quote card live patch ──────────────────────────────────────────────────
function patchQuoteCard(q) {
  const pcc = cc(q.change);
  const priceEl  = document.getElementById('live-price');
  const changeEl = document.getElementById('live-change');
  const tsEl     = document.getElementById('live-ts');
  const old = state._lastQuote ? state._lastQuote.price : null;
  if (priceEl)  {
    flashCell(priceEl, old, q.price);
    priceEl.textContent = fmt.price(q.price);
    priceEl.className   = 'quote-price ' + pcc;
  }
  if (changeEl) {
    changeEl.textContent = `${fmt.pct(q.change_pct)} ${q.change!=null?`(${q.change>0?'+':''}${fmt.price(q.change)})`:''}`;
    changeEl.className = 'quote-change ' + pcc;
  }
  if (tsEl) tsEl.textContent = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if (state._lastQuote) state._lastQuote.price = q.price;
}

async function forceRefresh() {
  if (!state.activeTicker) return;
  try {
    const q = await api('/quote/' + state.activeTicker);
    patchQuoteCard(q);
  } catch {}
}

// ── Momentum Score ─────────────────────────────────────────────────────────
function calcMomentumScore(indicators) {
  const data = indicators.data;
  const valid = data.filter(d => d.rsi != null);
  const last = valid.slice(-1)[0];
  const prev = valid.slice(-2)[0];
  if (!last) return 0;

  let score = 0;

  if (last.rsi < 35) score += 1;
  else if (last.rsi > 65) score -= 1;

  if (last.macd_hist != null && prev?.macd_hist != null) {
    if (last.macd_hist > 0 && last.macd_hist >= prev.macd_hist) score += 1;
    else if (last.macd_hist < 0 && last.macd_hist <= prev.macd_hist) score -= 1;
  }

  if (last.close != null && last.bb_lower != null && last.bb_upper != null) {
    if (last.close <= last.bb_lower * 1.05) score += 1;
    else if (last.close >= last.bb_upper * 0.95) score -= 1;
  }

  return Math.max(-3, Math.min(3, score));
}

function momentumLabel(score) {
  if (score >= 3)  return ['Forte Alta', 'pos'];
  if (score > 0)   return ['Alta', 'pos'];
  if (score === 0) return ['Neutro', 'neu'];
  if (score <= -3) return ['Forte Baixa', 'neg'];
  return ['Baixa', 'neg'];
}

// ── Chart helpers ──────────────────────────────────────────────────────────
const C = {
  accent:'#58a6ff', green:'#3fb950', red:'#f85149',
  yellow:'#d29922', purple:'#bc8cff', muted:'#7d8590',
  grid:'rgba(48,54,61,0.8)',
  mono:"'JetBrains Mono', ui-monospace, monospace",
};

function baseOpts(yLabel='') {
  return {
    responsive:true, maintainAspectRatio:true,
    animation:{duration:350},
    plugins:{
      legend:{labels:{color:C.muted, boxWidth:11, padding:10, font:{size:11}}},
      tooltip:{mode:'index', intersect:false, titleFont:{family:C.mono}, bodyFont:{family:C.mono}},
    },
    scales:{
      x:{type:'time', time:{tooltipFormat:'dd/MM/yyyy'},
        ticks:{color:C.muted, maxTicksLimit:7, maxRotation:0, font:{size:10, family:C.mono}},
        grid:{color:C.grid}},
      y:{ticks:{color:C.muted, font:{size:10, family:C.mono}}, grid:{color:C.grid},
        title:{display:!!yLabel, text:yLabel, color:C.muted, font:{size:11}}},
    },
    interaction:{mode:'index', intersect:false},
  };
}

// ── Price + Volume chart ───────────────────────────────────────────────────
function drawPriceChart(data, currency='USD') {
  destroyChart('price');
  const ctx = document.getElementById('priceChart')?.getContext('2d');
  if (!ctx) return;

  const labels = data.map(d=>d.date);
  const closes = data.map(d=>d.close);
  const volumes = data.map(d=>d.volume);
  const first = closes.find(v=>v!=null);
  const last  = closes.filter(v=>v!=null).slice(-1)[0];
  const up = last >= first;
  const lineColor = up ? C.green : C.red;

  const grad = ctx.createLinearGradient(0,0,0,240);
  grad.addColorStop(0, up ? 'rgba(63,185,80,.22)' : 'rgba(248,81,73,.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  state.charts.price = new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'line', label:'Fechamento', data:closes,
          borderColor:lineColor, backgroundColor:grad,
          fill:true, pointRadius:0, tension:0.1, borderWidth:2,
          yAxisID:'yP', order:1},
        {type:'bar', label:'Volume', data:volumes,
          backgroundColor:data.map((_,i)=>{
            const c=closes[i], p=closes[i-1];
            if(c==null||p==null) return 'rgba(88,166,255,.15)';
            return c>=p ? 'rgba(63,185,80,.2)' : 'rgba(248,81,73,.2)';
          }),
          borderWidth:0, yAxisID:'yV', order:2},
      ],
    },
    options:{
      ...baseOpts(),
      scales:{
        x:{type:'time', time:{tooltipFormat:'dd/MM/yyyy'},
          ticks:{color:C.muted, maxTicksLimit:7, maxRotation:0, font:{size:10, family:C.mono}},
          grid:{color:C.grid}},
        yP:{position:'left', ticks:{color:C.muted, font:{size:10, family:C.mono}}, grid:{color:C.grid},
          title:{display:true, text:currency, color:C.muted, font:{size:11}}},
        yV:{position:'right', ticks:{color:C.muted, font:{size:10, family:C.mono}, callback:v=>fmt.large(v)},
          grid:{display:false}, title:{display:true, text:'Volume', color:C.muted, font:{size:11}}},
      },
    },
  });
}

// ── RSI chart ──────────────────────────────────────────────────────────────
function drawRSI(data) {
  destroyChart('rsi');
  const ctx = document.getElementById('rsiChart')?.getContext('2d');
  if (!ctx) return;

  const rsiZonePlugin = {
    id:'rsiZone',
    afterDraw(chart) {
      const {ctx:c, chartArea:{left,right}, scales:{y}} = chart;
      if (!y) return;
      c.save();
      c.setLineDash([5,4]);
      c.lineWidth = 1;
      c.strokeStyle = 'rgba(248,81,73,.55)';
      c.beginPath(); c.moveTo(left,y.getPixelForValue(70)); c.lineTo(right,y.getPixelForValue(70)); c.stroke();
      c.strokeStyle = 'rgba(63,185,80,.55)';
      c.beginPath(); c.moveTo(left,y.getPixelForValue(30)); c.lineTo(right,y.getPixelForValue(30)); c.stroke();
      c.restore();
    }
  };

  state.charts.rsi = new Chart(ctx, {
    type:'line',
    data:{
      labels:data.map(d=>d.date),
      datasets:[{label:'RSI', data:data.map(d=>d.rsi),
        borderColor:C.purple, pointRadius:0, borderWidth:1.5, fill:false, tension:0.1}],
    },
    options:{
      ...baseOpts(),
      scales:{...baseOpts().scales, y:{...baseOpts().scales.y, min:0, max:100}},
    },
    plugins:[rsiZonePlugin],
  });
}

// ── MACD chart ─────────────────────────────────────────────────────────────
function drawMACD(data) {
  destroyChart('macd');
  const ctx = document.getElementById('macdChart')?.getContext('2d');
  if (!ctx) return;
  state.charts.macd = new Chart(ctx, {
    type:'bar',
    data:{
      labels:data.map(d=>d.date),
      datasets:[
        {type:'line', label:'MACD',  data:data.map(d=>d.macd),        borderColor:C.accent, pointRadius:0, borderWidth:1.5, fill:false, tension:0.1, order:1},
        {type:'line', label:'Sinal', data:data.map(d=>d.macd_signal), borderColor:C.yellow, pointRadius:0, borderWidth:1.5, fill:false, tension:0.1, order:2},
        {type:'bar',  label:'Hist',  data:data.map(d=>d.macd_hist),
          backgroundColor:data.map(d=>(d.macd_hist??0)>=0?'rgba(63,185,80,.5)':'rgba(248,81,73,.5)'),
          borderWidth:0, order:3},
      ],
    },
    options:baseOpts(),
  });
}

// ── Bollinger chart ────────────────────────────────────────────────────────
function drawBollinger(data) {
  destroyChart('bb');
  const ctx = document.getElementById('bbChart')?.getContext('2d');
  if (!ctx) return;
  state.charts.bb = new Chart(ctx, {
    type:'line',
    data:{
      labels:data.map(d=>d.date),
      datasets:[
        {label:'BB Superior', data:data.map(d=>d.bb_upper), borderColor:'rgba(188,140,255,.4)', pointRadius:0, borderWidth:1, fill:'+1', backgroundColor:'rgba(188,140,255,.06)', tension:0.1},
        {label:'BB Inferior', data:data.map(d=>d.bb_lower), borderColor:'rgba(188,140,255,.4)', pointRadius:0, borderWidth:1, fill:false, tension:0.1},
        {label:'SMA 20', data:data.map(d=>d.sma20), borderColor:C.yellow, pointRadius:0, borderWidth:1.5, fill:false, tension:0.1, borderDash:[4,3]},
        {label:'SMA 50', data:data.map(d=>d.sma50), borderColor:C.accent, pointRadius:0, borderWidth:1.5, fill:false, tension:0.1, borderDash:[8,4]},
        {label:'Preço',   data:data.map(d=>d.close), borderColor:C.green, pointRadius:0, borderWidth:2,   fill:false, tension:0.1},
      ],
    },
    options:baseOpts(),
  });
}

// ── Period switch ──────────────────────────────────────────────────────────
async function changePeriod(period) {
  state.activePeriod = period;
  if (!state.activeTicker) return;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.period===period));
  try {
    const h = await api('/history/' + state.activeTicker + '?period=' + period);
    drawPriceChart(h.data, state._lastQuote?.currency);
  } catch {}
}

  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();

});
